name: Deploy LFS files to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger on main branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repo with LFS enabled
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true  # Important: fetch LFS files

      # Step 2: Install Git LFS
      - name: Install Git LFS
        run: |
          git lfs install
          git lfs pull

      # Step 3: Build site (example: copy files to output folder)
      - name: Prepare site
        run: |
          mkdir public
          cp HuntVideo.mp4 public/
          echo "<html><body><video src='myvideo.mp4' controls></video></body></html>" > public/index.html

      # Step 4: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish to Pages
        uses: actions/deploy-pages@v3